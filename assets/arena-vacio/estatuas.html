<!DOCTYPE html>
<!--
  Sala de esculturas — banco de pruebas de los Doce Testigos.

  Existe porque el anillo de estatuas se ve en el juego a treinta unidades de
  distancia y desde arriba: ahí no se distingue si un pectoral está donde debe
  ni si la cara tiene rasgos. Esta página las pone en fila, a la altura de los
  ojos, con la misma luz y el mismo tonemapping que la arena, y deja pasar de
  una a otra. Es la única forma de iterar sobre el modelado sin adivinar.

  No forma parte del juego ni la carga ninguna otra página.
-->
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Los Doce Testigos — sala de esculturas</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #030405; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    #ficha {
      position: fixed; left: 18px; top: 18px; z-index: 5;
      font: 13px/1.55 ui-monospace, "Cascadia Code", Consolas, monospace;
      color: #cfd6df; background: rgba(6, 9, 14, 0.72);
      border: 1px solid rgba(120, 160, 200, 0.18); border-radius: 10px;
      padding: 12px 16px; min-width: 250px; backdrop-filter: blur(6px);
    }
    #ficha h1 { margin: 0 0 8px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: #ffb638; }
    #ficha dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
    #ficha dt { color: #6f7d8c; }
    #ficha dd { margin: 0; color: #e6edf5; }
    #ayuda {
      position: fixed; left: 18px; bottom: 16px; z-index: 5;
      font: 12px/1.7 ui-monospace, Consolas, monospace; color: #56626f;
    }
    #ayuda b { color: #98a6b4; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="ficha"><h1>cargando…</h1></div>
  <div id="ayuda">
    <b>← →</b> cambiar de estatua &nbsp;·&nbsp; <b>espacio</b> girar &nbsp;·&nbsp;
    <b>T</b> todas en fila &nbsp;·&nbsp; ratón para orbitar
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
    import { crearMonumento } from './js/monumentos.js';

    // Misma configuración de render que el visor de juego: si aquí se ve bien
    // y allí no, el problema es de la escena, no de la escultura.
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.getElementById('app').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030405);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.2;

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
    camera.position.set(4.2, 3.6, 8.4);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.0, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;

    // Intensidades calibradas mirando el mármol, que es la piedra más clara:
    // con la luz que traía al principio se iba a blanco puro y se comía todo el
    // relieve — que es justo lo que esta página tiene que dejar ver.
    const key = new THREE.SpotLight(0xe6f0ff, 260, 60, 0.7, 0.6, 1.6);
    key.position.set(6, 16, 9); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.03;
    scene.add(key, key.target);
    const rim = new THREE.DirectionalLight(0x49e6ff, 2.2);
    rim.position.set(-10, 6, -12); scene.add(rim);
    const calida = new THREE.PointLight(0xffb638, 16, 26, 1.8);
    calida.position.set(-3, 1.6, 4); scene.add(calida);
    scene.add(new THREE.HemisphereLight(0x22303c, 0x04050a, 0.22));

    const suelo = new THREE.Mesh(
      new THREE.CircleGeometry(60, 64),
      new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.95, metalness: 0 })
    );
    suelo.rotation.x = -Math.PI / 2;
    suelo.receiveShadow = true;
    scene.add(suelo);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.35, 0.8));
    composer.addPass(new OutputPass());

    // ── las doce ──────────────────────────────────────────────────────────
    const t0 = performance.now();
    const efigies = [];
    for (let i = 0; i < 12; i++) efigies.push(crearMonumento(i + 1, i));
    const msCarga = Math.round(performance.now() - t0);

    const soporte = new THREE.Group();
    scene.add(soporte);
    let indice = 0, enFila = false, girando = true, angulo = 0;

    function montar() {
      soporte.clear();
      if (enFila) {
        efigies.forEach((m, i) => {
          m.position.set((i - 5.5) * 4.2, 0, 0);
          m.rotation.y = 0;
          soporte.add(m);
        });
        controls.target.set(0, 3.4, 0);
        camera.position.set(0, 6.5, 30);
      } else {
        const m = efigies[indice];
        m.position.set(0, 0, 0);
        soporte.add(m);
        controls.target.set(0, 3.0, 0);
      }
      controls.update();
      ficha();
    }

    function ficha() {
      const caja = new THREE.Box3().setFromObject(efigies[indice]);
      const p = efigies[indice].userData.perfil;
      const filas = enFila
        ? [['en fila', 'las doce a la vez'], ['carga', `${msCarga} ms las 12`]]
        : [
            ['nº', `${indice + 1} de 12`],
            ['piedra', p.piedra], ['metal', p.metal],
            ['cuerpo', p.complexion + (p.barbado ? ' · barbado' : '') + (p.melena ? ' · melena' : '')],
            ['ropaje', p.ropaje], ['atributo', p.atributo],
            ['estado', p.dano], ['pedestal', p.pedestal],
            ['altura', `${caja.max.y.toFixed(2)} u`],
            ['triángulos', p.triangulos.toLocaleString('es')],
            ['carga', `${msCarga} ms las 12`],
          ];
      document.getElementById('ficha').innerHTML =
        `<h1>${enFila ? 'Los Doce Testigos' : 'Testigo ' + (indice + 1)}</h1><dl>` +
        filas.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('') + '</dl>';
    }

    addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight') { indice = (indice + 1) % 12; enFila = false; montar(); }
      else if (e.code === 'ArrowLeft') { indice = (indice + 11) % 12; enFila = false; montar(); }
      else if (e.code === 'Space') { girando = !girando; e.preventDefault(); }
      else if (e.code === 'KeyT') { enFila = !enFila; montar(); }
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });

    montar();

    // Expuesto para poder inspeccionar desde la consola sin tocar la página.
    window.sala = {
      efigies, camera, controls, scene, renderer, msCarga,
      info: renderer.info,
      ficha: () => efigies[indice].userData.perfil,
      ver: (n) => { indice = ((n % 12) + 12) % 12; enFila = false; montar(); return efigies[indice].userData.perfil; },
      // Encuadre para mirar un detalle: mirar(altura, ángulo, distancia).
      mirar: (y = 3, a = 0, d = 3) => {
        girando = false; soporte.rotation.y = 0;
        controls.target.set(0, y, 0);
        camera.position.set(Math.sin(a) * d, y + d * 0.12, Math.cos(a) * d);
        controls.update();
      },
    };

    const reloj = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = reloj.getDelta();
      if (girando && !enFila) { angulo += dt * 0.35; soporte.rotation.y = angulo; }
      controls.update();
      composer.render();
    });
  </script>
</body>
</html>
